version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22
        - nvm use 22
        - npm install
    build:
      commands:
        # VITE_API_URL and VITE_RECAPTCHA_SITE_KEY must come from Amplify Console
        # → Hosting → Environment variables. Never hardcode them in app source.
        - |
          if [ -z "$VITE_API_URL" ]; then
            echo "ERROR: VITE_API_URL is not set."
            echo "Add it in Amplify Console → App settings → Environment variables"
            echo "Example: VITE_API_URL=https://api.namecardscan.com"
            exit 1
          fi
          if [ -z "$VITE_RECAPTCHA_SITE_KEY" ]; then
            echo "ERROR: VITE_RECAPTCHA_SITE_KEY is not set."
            echo "Use the same Google reCAPTCHA v2 site key as the main NameCardScan app."
            echo "Add it in Amplify Console → App settings → Environment variables"
            exit 1
          fi
          echo "Building CMS with VITE_API_URL and VITE_RECAPTCHA_SITE_KEY from Amplify"
          npm run build
  artifacts:
    baseDirectory: dist
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
  customHeaders:
    - pattern: "assets/**/*"
      headers:
        - key: "Cache-Control"
          value: "public, max-age=31536000, immutable"
    - pattern: "*.html"
      headers:
        - key: "Cache-Control"
          value: "no-cache, no-store, must-revalidate"
customRules:
  # SPA fallback — 404-200 rewrites missing paths to index.html (required for /login/ refresh).
  - source: "/login"
    target: "/index.html"
    status: "404-200"
  - source: "/login/"
    target: "/index.html"
    status: "404-200"
  - source: "/<*>"
    target: "/index.html"
    status: "404-200"
